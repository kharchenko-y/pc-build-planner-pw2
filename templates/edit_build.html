{% extends 'base.html' %}
{% block title %}Edit build | PC Build Planner{% endblock %}
{% block content %}
<h1>Edit build</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="form">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="title">Build name</label>
  <input id="title" name="title" value="{{ build.title }}" minlength="2" maxlength="60" required>
  <button type="submit">Save changes</button>
</form>
{% endblock %}
