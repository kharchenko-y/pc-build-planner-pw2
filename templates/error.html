{% extends 'base.html' %}
{% block title %}Request error | PC Build Planner{% endblock %}
{% block content %}
<div class="panel narrow error-page">
  <h1>Could not complete the request</h1>
  <p class="message" role="alert">{{ error }}</p>
  <div class="form-actions">
    {% if user %}
    <a class="btn" href="/">Back to My builds</a>
    <a class="btn btn-secondary" href="/components">Open the catalogue</a>
    {% else %}
    <a class="btn" href="/login">Log in</a>
    <a class="btn btn-secondary" href="/">Return to the home page</a>
    {% endif %}
  </div>
</div>
{% endblock %}
