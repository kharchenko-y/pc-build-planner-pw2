{% extends 'base.html' %}
{% block title %}Login | PC Build Planner{% endblock %}
{% block content %}
<h1>Login</h1>
<p>Sign in with the account provided for your demonstration.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form class="form" method="post" action="/login">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="username">Username</label>
  <input id="username" name="username" required maxlength="32" autocomplete="username">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password">
  <button type="submit">Log in</button>
</form>
{% endblock %}
