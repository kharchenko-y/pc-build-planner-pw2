{% extends 'base.html' %}
{% from '_macros.html' import brand_mark %}
{% block title %}Log in | PC Build Planner{% endblock %}
{% block content %}
<div class="login">
  <div class="sheet sheet-pad">
    <h1>Log in</h1>
    <p class="lede">Use the account provided for the class. Your builds are private to your account.</p>
    {% if error %}<div class="notice notice-error" role="alert" id="login-error"><p>{{ error }}</p></div>{% endif %}
    <form class="form" method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" required maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false"{% if error %} aria-invalid="true" aria-describedby="login-error"{% endif %}>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password"{% if error %} aria-invalid="true" aria-describedby="login-error"{% endif %}>
      </div>
      <button class="btn-block" type="submit">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
