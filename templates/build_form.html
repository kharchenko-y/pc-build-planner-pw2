{% extends 'base.html' %}
{% block title %}{{ heading }} | PC Build Planner{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="form">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="title">Build name</label>
  <input id="title" name="title" value="{{ title }}" minlength="2" maxlength="60" required>
  <label for="budget">Budget (EUR)</label>
  <input id="budget" name="budget" type="number" min="0" max="100000" step="0.01" value="{{ budget }}" aria-describedby="budget-hint" required>
  <small id="budget-hint">Enter 0 if you have no budget limit.</small>
  <button type="submit">{{ submit }}</button>
</form>
{% endblock %}
