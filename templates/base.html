<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PC Build Planner - practical database-backed web project.">
  <title>{% block title %}PC Build Planner{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/actions.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header>
  <div class="container topbar">
    <a class="logo" href="/">PC Build Planner</a>
    <nav aria-label="Main navigation">
      {% if user %}
      <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>My builds</a>
      <a href="/components" {% if request.url.path == '/components' %}aria-current="page"{% endif %}>Components</a>
      <a href="/report" {% if request.url.path == '/report' %}aria-current="page"{% endif %}>Report</a>
      {% else %}
      <a href="/login" {% if request.url.path == '/login' %}aria-current="page"{% endif %}>Log in</a>
      {% endif %}
    </nav>
    {% if user %}
      <div class="account">
        <span>{{ user.username }} ({{ user.role }})</span>
        <form action="/logout" method="post">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button class="small secondary" type="submit">Log out</button>
        </form>
      </div>
    {% endif %}
  </div>
</header>
<main id="main" class="container">
  {% if notice %}<p class="notice" role="status">{{ notice }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>
<footer class="container">PW2 prototype · 2026 · Demo catalogue and prices</footer>
</body>
</html>
