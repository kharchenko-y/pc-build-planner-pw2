{% extends 'base.html' %}
{% block title %}Components | PC Build Planner{% endblock %}
{% block content %}
<h1>Component catalogue</h1>
<p>Browse example parts and illustrative prices.</p>
<form id="catalogue-filter" class="filters" method="get" action="/components">
  <label for="q">Search name</label>
  <input id="q" name="q" value="{{ q }}" placeholder="CPU, SSD…" maxlength="80">
  <label for="category">Category</label>
  <select id="category" name="category">
    <option value="">All categories</option>
    {% for cat in categories %}
    <option value="{{ cat.name }}" {% if selected == cat.name %}selected{% endif %}>{{ cat.name }}</option>
    {% endfor %}
  </select>
  <button type="submit">Search</button>
</form>
{% if user.role == 'admin' %}
<div class="actions">
  <a class="button" href="/components/new">Add component</a>
  <a href="/components/import">Import CSV</a>
</div>
{% endif %}
<p id="catalogue-status" role="status"></p>
<section id="catalogue-results" aria-label="Catalogue search results">
  {% include 'component_results.html' %}
</section>
{% endblock %}
