{% extends 'base.html' %}
{% block title %}Confirm deletion | PC Build Planner{% endblock %}
{% block content %}
<h1>Delete {{ entity }}?</h1>
<p><strong>{{ name }}</strong></p>
<p>{{ explanation }}</p>
<form method="post" action="{{ action }}" class="actions">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <button class="danger" name="confirmed" value="yes" type="submit">Delete {{ entity }}</button>
  <a href="{{ cancel }}">Cancel</a>
</form>
{% endblock %}
