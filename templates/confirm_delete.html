{% extends 'base.html' %}
{% block title %}Confirm deletion | PC Build Planner{% endblock %}
{% block content %}
<div class="panel narrow confirm">
  <h1>Delete {{ entity }}?</h1>
  <p class="target">{{ name }}</p>
  <p>{{ explanation }} This cannot be undone.</p>
  <form method="post" action="{{ action }}" class="form-actions">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="btn-danger" name="confirmed" value="yes" type="submit">Delete {{ entity }}</button>
    <a class="btn btn-secondary" href="{{ cancel }}">Cancel</a>
  </form>
</div>
{% endblock %}
