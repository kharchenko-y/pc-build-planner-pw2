{% extends 'base.html' %}
{% block title %}Add component | PC Build Planner{% endblock %}
{% block content %}
<h1>Add component (admin only)</h1>
<form class="form" method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="name">Component name</label><input name="name" id="name" maxlength="80" required>
  <label for="category_id">Category</label>
  <select name="category_id" id="category_id" required>
    {% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}
  </select>
  <label for="price">Price in EUR</label><input name="price" id="price" type="number" min="0" step="0.01" required>
  <button type="submit">Add to catalogue</button>
</form>
{% endblock %}
