{% extends 'base.html' %}
{% block title %}Create build | PC Build Planner{% endblock %}
{% block content %}
<h1>Create a PC build</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/builds/new" class="form">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="title">Build name</label>
  <input id="title" name="title" minlength="2" maxlength="60" required placeholder="Budget gaming PC">
  <label for="budget">Budget (EUR)</label>
  <input id="budget" name="budget" type="number" min="0" step="0.01" value="1000" required>
  <button type="submit">Save build</button>
</form>
{% endblock %}
