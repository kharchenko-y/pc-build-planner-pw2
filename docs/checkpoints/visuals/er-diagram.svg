<text x="798" y="503" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#172f34" text-anchor="middle">1 → 0..*</text>
<text x="48" y="688" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172f34" text-anchor="start">CASCADE · user → builds/sessions · build → items</text>
<text x="48" y="715" font-family="system-ui,sans-serif" font-size="16" font-weight="450" fill="#172f34" text-anchor="start">RESTRICT · category → components · component → items     |     PK primary key · FK foreign key · UK unique</text>
